<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<style>
body{font-family:sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#222}
h2{color:#1a4080;border-bottom:2px solid #1a4080;padding-bottom:4px;margin-top:2em}
table{border-collapse:collapse;width:100%;margin:8px 0}
td{padding:6px 12px;vertical-align:top;border:1px solid #ddd}
td:first-child{font-weight:bold;width:120px;white-space:nowrap;background:#f5f5f5}
.notes{background:#fffbe6;border-left:4px solid #f0c040;padding:8px 12px;margin:8px 0;font-style:italic}
.options li{margin:2px 0}
hr{border:none;border-top:1px solid #ccc;margin:2em 0}
</style></head><body>
<hr></body></html>
